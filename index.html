<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffeef5">
<title>나의 가계부 🐷</title>
<style>
  :root {
    --bg1: #fff5fa;
    --bg2: #f3f6ff;
    --card: #ffffff;
    --ink: #4d4459;
    --muted: #a49bb3;
    --line: #f2e9f4;
    --pink: #ff8fb1;
    --mint: #34c795;
    --mint-soft: #dcf7ec;
    --coral: #ff6b81;
    --coral-soft: #ffe4e8;
    --lav: #a68bf7;
    --lav-soft: #eee8ff;
    --yellow: #ffd15c;
    --shadow-s: 0 4px 14px rgba(166, 139, 247, 0.10);
    --shadow-m: 0 10px 28px rgba(166, 139, 247, 0.16);
    --shadow-l: 0 20px 50px rgba(120, 90, 200, 0.22);
    --r: 22px;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Segoe UI", "Malgun Gothic", sans-serif;
    color: var(--ink);
    background: linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 100%);
    background-attachment: fixed;
    padding: 20px 16px 110px;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- 배경 몽글몽글 ---------- */
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(60px);
    opacity: .5;
    z-index: -1;
    pointer-events: none;
  }
  .blob.b1 { width: 320px; height: 320px; background: #ffd3e4; top: -90px; left: -80px; animation: drift1 18s ease-in-out infinite; }
  .blob.b2 { width: 280px; height: 280px; background: #d7e2ff; bottom: -80px; right: -70px; animation: drift2 22s ease-in-out infinite; }
  .blob.b3 { width: 220px; height: 220px; background: #fff0c9; top: 45%; right: -60px; animation: drift1 26s ease-in-out infinite reverse; }
  @keyframes drift1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(40px, 30px) scale(1.12); } }
  @keyframes drift2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-36px,-26px) scale(1.1); } }

  .wrap { max-width: 720px; margin: 0 auto; }

  /* ---------- 헤더 ---------- */
  .hero {
    display: flex;
    align-items: center;
    gap: 14px;
    background: linear-gradient(120deg, #ffe7f1 0%, #eee9ff 55%, #e4f4ff 100%);
    background-size: 200% 200%;
    animation: shimmer 12s ease infinite, slideUp .5s ease both;
    border-radius: 26px;
    padding: 16px 18px;
    box-shadow: var(--shadow-s);
    margin-bottom: 16px;
  }
  @keyframes shimmer { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
  .mascot {
    font-size: 40px;
    line-height: 1;
    animation: floaty 3.2s ease-in-out infinite;
    cursor: pointer;
    user-select: none;
    flex-shrink: 0;
  }
  @keyframes floaty { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-8px) rotate(3deg); } }
  .hero h1 { font-size: 20px; margin: 0 0 3px; letter-spacing: -.4px; }
  .bubble {
    font-size: 12.5px;
    color: #7a6f8a;
    background: rgba(255,255,255,.75);
    display: inline-block;
    padding: 4px 10px;
    border-radius: 999px;
    animation: popIn .45s ease both;
  }

  /* ---------- 월 네비 ---------- */
  .monthbar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 14px;
    animation: slideUp .5s .05s ease both;
  }
  .navbtn {
    width: 38px; height: 38px;
    border: none;
    border-radius: 50%;
    background: var(--card);
    box-shadow: var(--shadow-s);
    color: var(--lav);
    font-size: 18px;
    cursor: pointer;
    transition: transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s;
  }
  .navbtn:hover { transform: scale(1.15); box-shadow: var(--shadow-m); }
  .navbtn:active { transform: scale(.92); }
  .mtitle { font-size: 18px; font-weight: 800; min-width: 130px; text-align: center; letter-spacing: -.3px; }
  .todaybtn {
    border: none;
    background: var(--lav-soft);
    color: #7b5fe0;
    font-size: 12px;
    font-weight: 700;
    padding: 7px 12px;
    border-radius: 999px;
    cursor: pointer;
    transition: transform .18s cubic-bezier(.34,1.56,.64,1);
  }
  .todaybtn:hover { transform: translateY(-2px) scale(1.05); }

  /* ---------- 요약 카드 ---------- */
  .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 8px; }
  .scard {
    background: var(--card);
    border-radius: var(--r);
    padding: 14px 10px;
    text-align: center;
    box-shadow: var(--shadow-s);
    animation: popIn .5s ease both;
    transition: transform .2s cubic-bezier(.34,1.56,.64,1), box-shadow .2s;
  }
  .scard:nth-child(1) { animation-delay: .06s; }
  .scard:nth-child(2) { animation-delay: .12s; }
  .scard:nth-child(3) { animation-delay: .18s; }
  .scard:hover { transform: translateY(-4px); box-shadow: var(--shadow-m); }
  .scard .emo { font-size: 20px; display: block; margin-bottom: 2px; }
  .scard .lb { font-size: 11.5px; color: var(--muted); margin-bottom: 3px; }
  .scard .vl { font-size: 16px; font-weight: 800; letter-spacing: -.5px; white-space: nowrap; }
  .vl.inc { color: var(--mint); }
  .vl.exp { color: var(--coral); }
  .vl.bal { color: var(--lav); }

  .ratio {
    height: 9px;
    background: var(--mint-soft);
    border-radius: 999px;
    overflow: hidden;
    margin: 12px 2px 20px;
    box-shadow: inset 0 1px 3px rgba(0,0,0,.05);
  }
  .ratio > i {
    display: block;
    height: 100%;
    width: 0;
    border-radius: 999px;
    background: linear-gradient(90deg, #ffb3a7, var(--coral));
    transition: width .8s cubic-bezier(.22,1,.36,1);
  }

  /* ---------- 카드 공통 ---------- */
  .panel {
    background: var(--card);
    border-radius: 26px;
    box-shadow: var(--shadow-s);
    padding: 16px;
    margin-bottom: 16px;
    animation: slideUp .5s .1s ease both;
  }
  .panel h2 {
    font-size: 14px;
    margin: 0 0 12px;
    display: flex;
    align-items: center;
    gap: 6px;
    letter-spacing: -.3px;
  }
  .panel h2 .tag {
    margin-left: auto;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    background: #f7f4fb;
    padding: 4px 9px;
    border-radius: 999px;
  }

  /* ---------- 달력 ---------- */
  .dow { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 6px; }
  .dow span { text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); padding: 2px 0; }
  .dow span:first-child { color: #ff9aa9; }
  .dow span:last-child { color: #93b4f5; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .grid.in-left { animation: inLeft .32s cubic-bezier(.22,1,.36,1); }
  .grid.in-right { animation: inRight .32s cubic-bezier(.22,1,.36,1); }
  @keyframes inLeft { from { opacity: 0; transform: translateX(-26px); } to { opacity: 1; transform: none; } }
  @keyframes inRight { from { opacity: 0; transform: translateX(26px); } to { opacity: 1; transform: none; } }

  .day {
    position: relative;
    min-height: 62px;
    border: 1.5px solid transparent;
    border-radius: 15px;
    background: #fbf9fd;
    padding: 5px 4px 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    cursor: pointer;
    font: inherit;
    color: inherit;
    animation: popIn .34s ease both;
    transition: transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s, background .18s, border-color .18s;
  }
  .day:hover { transform: translateY(-3px) scale(1.04); box-shadow: var(--shadow-m); background: #fff; z-index: 2; }
  .day:active { transform: scale(.95); }
  .day.pad { background: transparent; cursor: default; pointer-events: none; opacity: .35; }
  .day .dn { font-size: 12.5px; font-weight: 700; color: #6b6178; }
  .day.sun .dn { color: #ff8095; }
  .day.sat .dn { color: #7ea6f2; }
  .day.today { border-color: var(--yellow); background: #fffaec; }
  .day.today .dn::after {
    content: "";
    display: block;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--yellow);
    margin: 1px auto 0;
    animation: blink 1.6s ease-in-out infinite;
  }
  @keyframes blink { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
  .day.sel {
    background: linear-gradient(145deg, #ffd9e8, #e6dcff);
    border-color: #c9b4ff;
    box-shadow: 0 6px 18px rgba(166,139,247,.3);
    animation: bounceSel .45s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes bounceSel { 0% { transform: scale(1); } 45% { transform: scale(1.14); } 100% { transform: scale(1); } }
  .day .amt { font-size: 9.5px; font-weight: 700; line-height: 1.35; white-space: nowrap; }
  .day .amt.i { color: #22a97c; }
  .day .amt.e { color: #f2556d; }
  .day .warn {
    position: absolute;
    top: 2px; right: 3px;
    font-size: 10px;
    animation: shake 2.4s ease-in-out infinite;
  }
  @keyframes shake { 0%,88%,100% { transform: rotate(0); } 91% { transform: rotate(-16deg); } 94% { transform: rotate(16deg); } 97% { transform: rotate(-10deg); } }

  /* ---------- 하루 상세 ---------- */
  .dayhead { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .dayhead .d { font-size: 15px; font-weight: 800; letter-spacing: -.3px; }
  .dayhead .sm { font-size: 11.5px; color: var(--muted); }
  .addmini {
    margin-left: auto;
    border: none;
    background: linear-gradient(135deg, var(--pink), var(--lav));
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    padding: 8px 14px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 6px 14px rgba(255,143,177,.35);
    transition: transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s;
  }
  .addmini:hover { transform: translateY(-2px) scale(1.05); box-shadow: 0 10px 20px rgba(255,143,177,.45); }
  .addmini:active { transform: scale(.94); }

  .item {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 10px;
    border-radius: 16px;
    cursor: pointer;
    animation: slideUp .34s ease both;
    transition: background .18s, transform .18s;
  }
  .item:hover { background: #faf7fd; transform: translateX(3px); }
  .item.removing { animation: poof .32s ease forwards; }
  @keyframes poof { to { opacity: 0; transform: scale(.7) translateX(40px); } }
  .item .ic {
    width: 40px; height: 40px;
    border-radius: 14px;
    display: grid;
    place-items: center;
    font-size: 19px;
    flex-shrink: 0;
    transition: transform .25s cubic-bezier(.34,1.56,.64,1);
  }
  .item:hover .ic { transform: rotate(-8deg) scale(1.1); }
  .item .ic.expense { background: var(--coral-soft); }
  .item .ic.income { background: var(--mint-soft); }
  .item .tx { min-width: 0; flex: 1; }
  .item .t1 { font-size: 13.5px; font-weight: 700; display: flex; align-items: center; gap: 5px; }
  .item .t2 { font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .big-badge {
    font-size: 10px;
    font-weight: 800;
    color: #d9384f;
    background: var(--coral-soft);
    padding: 2px 7px;
    border-radius: 999px;
    animation: shake 3s ease-in-out infinite;
  }
  .item .money { font-size: 14px; font-weight: 800; white-space: nowrap; letter-spacing: -.3px; }
  .item .money.income { color: var(--mint); }
  .item .money.expense { color: var(--coral); }
  .item .del {
    border: none;
    background: none;
    color: #d8cfe2;
    font-size: 17px;
    cursor: pointer;
    padding: 4px 2px;
    line-height: 1;
    transition: transform .2s, color .2s;
  }
  .item .del:hover { color: var(--coral); transform: rotate(90deg) scale(1.2); }

  .empty { text-align: center; padding: 26px 10px; color: var(--muted); font-size: 13px; }
  .empty .big { font-size: 34px; display: block; margin-bottom: 8px; animation: floaty 3s ease-in-out infinite; }

  /* ---------- 큰 지출 알림 배너 ---------- */
  .bigalert {
    display: flex;
    align-items: center;
    gap: 9px;
    background: linear-gradient(120deg, #fff0d6, #ffe1e6);
    border: 1.5px solid #ffd0a8;
    border-radius: 18px;
    padding: 11px 14px;
    font-size: 12.5px;
    font-weight: 700;
    color: #b9603f;
    margin-bottom: 14px;
    animation: popIn .4s ease both;
  }
  .bigalert .em { font-size: 20px; animation: shake 2s ease-in-out infinite; }

  /* ---------- 분류 통계 ---------- */
  .bar { margin-bottom: 11px; animation: slideUp .4s ease both; }
  .bar .top { display: flex; align-items: center; gap: 7px; font-size: 12.5px; margin-bottom: 5px; }
  .bar .top .nm { font-weight: 700; }
  .bar .top .pc { margin-left: auto; color: var(--muted); font-size: 11.5px; font-weight: 700; }
  .bar .top .mn { font-weight: 700; font-size: 12px; }
  .bar .track { height: 10px; background: #f5f1f9; border-radius: 999px; overflow: hidden; }
  .bar .track > i {
    display: block; height: 100%; width: 0;
    border-radius: 999px;
    background: linear-gradient(90deg, #ffc2d1, var(--pink));
    transition: width .9s cubic-bezier(.22,1,.36,1);
  }
  .bar:nth-child(2n) .track > i { background: linear-gradient(90deg, #d9ccff, var(--lav)); }
  .bar:nth-child(3n) .track > i { background: linear-gradient(90deg, #ffe6a8, var(--yellow)); }

  /* ---------- 세그먼트 ---------- */
  .seg {
    position: relative;
    display: flex;
    background: #f6f2fa;
    border-radius: 999px;
    padding: 3px;
    margin-bottom: 10px;
  }
  .seg button {
    position: relative;
    z-index: 1;
    flex: 1;
    border: none;
    background: none;
    padding: 7px 0;
    font: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--muted);
    cursor: pointer;
    transition: color .22s;
  }
  .seg button.on { color: #5b4d6e; }
  .seg .pill {
    position: absolute;
    top: 3px; left: 3px;
    height: calc(100% - 6px);
    background: #fff;
    border-radius: 999px;
    box-shadow: 0 3px 9px rgba(120,90,200,.15);
    transition: transform .3s cubic-bezier(.34,1.4,.64,1), width .3s;
  }

  /* ---------- FAB ---------- */
  .fab {
    position: fixed;
    right: 20px; bottom: 22px;
    width: 60px; height: 60px;
    border: none;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--pink), var(--lav));
    color: #fff;
    font-size: 30px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 12px 26px rgba(166,139,247,.45);
    z-index: 40;
    animation: popIn .5s .3s ease both;
    transition: transform .2s cubic-bezier(.34,1.56,.64,1), box-shadow .2s;
  }
  .fab:hover { transform: scale(1.12) rotate(90deg); box-shadow: 0 16px 34px rgba(166,139,247,.55); }
  .fab:active { transform: scale(.9); }

  /* ---------- 입력 시트 ---------- */
  .backdrop {
    position: fixed; inset: 0;
    background: rgba(74, 62, 92, .35);
    backdrop-filter: blur(3px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .28s;
    z-index: 50;
  }
  .backdrop.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed;
    z-index: 60;
    left: 50%; top: 50%;
    transform: translate(-50%, -46%) scale(.9);
    width: min(430px, calc(100% - 28px));
    max-height: 88vh;
    overflow-y: auto;
    background: var(--card);
    border-radius: 28px;
    padding: 20px;
    box-shadow: var(--shadow-l);
    opacity: 0;
    pointer-events: none;
    transition: opacity .26s, transform .34s cubic-bezier(.34,1.45,.64,1);
  }
  .sheet.open { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
  .sheet.shake { animation: sheetShake .45s ease; }
  @keyframes sheetShake {
    0%,100% { transform: translate(-50%,-50%) scale(1) rotate(0); }
    20% { transform: translate(calc(-50% - 9px),-50%) scale(1) rotate(-1deg); }
    45% { transform: translate(calc(-50% + 9px),-50%) scale(1) rotate(1deg); }
    70% { transform: translate(calc(-50% - 5px),-50%) scale(1) rotate(-.5deg); }
  }
  .sheet h2 { margin: 0 0 14px; font-size: 17px; display: flex; align-items: center; gap: 7px; }
  .sheet h2 .x {
    margin-left: auto;
    border: none; background: #f6f2fa;
    width: 30px; height: 30px; border-radius: 50%;
    color: var(--muted); font-size: 16px; cursor: pointer;
    transition: transform .2s, background .2s;
  }
  .sheet h2 .x:hover { transform: rotate(90deg); background: var(--coral-soft); color: var(--coral); }

  .fld { margin-bottom: 13px; }
  .fld > label { display: block; font-size: 11.5px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
  .fld input[type="text"], .fld input[type="date"] {
    width: 100%;
    padding: 11px 13px;
    border: 1.5px solid var(--line);
    border-radius: 14px;
    font: inherit;
    font-size: 14px;
    background: #fdfcfe;
    color: var(--ink);
    transition: border-color .2s, box-shadow .2s, transform .2s;
  }
  .fld input:focus {
    outline: none;
    border-color: #d9c8ff;
    box-shadow: 0 0 0 4px rgba(166,139,247,.14);
    transform: translateY(-1px);
  }
  #fAmount { font-size: 21px; font-weight: 800; text-align: right; letter-spacing: -.5px; }
  #fAmount.bump { animation: bump .3s cubic-bezier(.34,1.56,.64,1); }
  #fAmount.danger-in { border-color: #ffb3a7; box-shadow: 0 0 0 4px rgba(255,107,129,.14); color: #e0455c; }
  @keyframes bump { 0% { transform: scale(1); } 45% { transform: scale(1.06); } 100% { transform: scale(1); } }

  .quick { display: flex; gap: 6px; margin-top: 7px; flex-wrap: wrap; }
  .quick button {
    border: none;
    background: #f6f2fa;
    color: #6d6280;
    font: inherit;
    font-size: 11.5px;
    font-weight: 700;
    padding: 6px 11px;
    border-radius: 999px;
    cursor: pointer;
    transition: transform .16s cubic-bezier(.34,1.56,.64,1), background .16s, color .16s;
  }
  .quick button:hover { background: var(--lav-soft); color: #7b5fe0; transform: translateY(-2px); }
  .quick button:active { transform: scale(.9); }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    border: 1.5px solid var(--line);
    background: #fdfcfe;
    border-radius: 999px;
    padding: 7px 12px;
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: #6d6280;
    cursor: pointer;
    transition: transform .16s cubic-bezier(.34,1.56,.64,1), background .16s, border-color .16s, color .16s;
  }
  .chip:hover { transform: translateY(-2px) scale(1.04); }
  .chip.on {
    background: linear-gradient(135deg, #ffe0ec, #ece4ff);
    border-color: #d5c3ff;
    color: #6b4fd0;
    animation: bounceSel .4s cubic-bezier(.34,1.56,.64,1);
  }

  .save {
    width: 100%;
    border: none;
    padding: 14px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--pink), var(--lav));
    color: #fff;
    font: inherit;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 10px 22px rgba(166,139,247,.35);
    margin-top: 4px;
    transition: transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s, background .3s;
  }
  .save:hover { transform: translateY(-2px); box-shadow: 0 14px 28px rgba(166,139,247,.45); }
  .save:active { transform: scale(.97); }
  .save.warn { background: linear-gradient(135deg, #ff9d6e, var(--coral)); box-shadow: 0 10px 22px rgba(255,107,129,.38); }
  .danger {
    width: 100%;
    border: none;
    background: none;
    color: var(--coral);
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    padding: 12px;
    cursor: pointer;
    border-radius: 14px;
    margin-top: 6px;
    transition: background .18s;
  }
  .danger:hover { background: var(--coral-soft); }

  /* ---------- 큰 지출 경고 모달 ---------- */
  .alertbox {
    position: fixed;
    z-index: 90;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%) scale(.85);
    width: min(330px, calc(100% - 40px));
    background: #fff;
    border-radius: 26px;
    padding: 24px 20px 18px;
    text-align: center;
    box-shadow: var(--shadow-l);
    opacity: 0;
    pointer-events: none;
    transition: opacity .24s, transform .36s cubic-bezier(.34,1.5,.64,1);
  }
  .alertbox.open { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }

  /* ---------- 토스트 / 컨페티 ---------- */

  .confetti { position: fixed; z-index: 80; pointer-events: none; font-size: 18px; will-change: transform, opacity; }

  .foot {

  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }

  @keyframes popIn { 0% { opacity: 0; transform: scale(.82) translateY(8px); } 60% { opacity: 1; transform: scale(1.04) translateY(-2px); } 100% { opacity: 1; transform: none; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* ============ 데이터 (Supabase에 저장) ============ */
var SUPABASE_URL = 'https://edrzispsyektwgmueglb.supabase.co';
var SUPABASE_KEY = 'sb_publishable_WvAHBNdadUih19MoNW4SqQ_IVEBsE_S';
var LEGACY_KEY = 'gagyebu_entries';        /* 예전 localStorage 키 */
var BACKUP_KEY = 'gagyebu_entries_backup'; /* 업로드 후 안전용 사본 */

var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

var BIG = 100000; /* 큰 지출 경고 기준: 10만원 */
var entries = [];  /* 화면이 그리는 원본. DB와 낙관적으로 동기화된다. */

/* ---- 동기화 상태 배지 ---- */
var busyOps = 0;
function setSync(cls, text) {
  var b = $('syncBadge');
  if (!b) return;
  b.className = 'sync' + (cls ? ' ' + cls : '');
  $('syncText').textContent = text;
}
function beginOp() { busyOps++; setSync('busy', '저장 중…'); }
function endOp(ok) {
  busyOps = Math.max(0, busyOps - 1);
  if (busyOps) return;
  setSync(ok ? '' : 'err', ok ? '동기화됨' : '동기화 실패');
}
function errText(err) {
  if (!err) return '';
  if (err.message && /Failed to fetch|NetworkError/i.test(err.message)) return '네트워크 연결을 확인해주세요';
  return err.message || String(err);
}

/* ---- DB 행 <-> 화면 객체 ---- */
function fromRow(r) {
  return { id: r.id, type: r.type, date: r.date, amount: Number(r.amount), category: r.category, memo: r.memo || '' };
}
function toRow(e) {
  return { type: e.type, date: e.date, amount: e.amount, category: e.category, memo: e.memo || '' };
}

/* ---- 읽기 ---- */
function loadEntries() {
  return sb.from('entries').select('id,type,date,amount,category,memo')
    .order('date', { ascending: false }).order('id', { ascending: false })
    .then(function (res) {
      if (res.error) throw res.error;
      entries = res.data.map(fromRow);
      return entries;
    });
}
function refresh() {
  beginOp();
  return loadEntries().then(function () { renderAll(); endOp(true); })
    .catch(function (err) { endOp(false); toast('내역을 불러오지 못했어요 — ' + errText(err), 'warn'); });
}

/* ---- 쓰기 (낙관적 갱신: 화면부터 바꾸고 DB는 뒤따라간다) ---- */
/* 임시 id로 이미 그려진 DOM을 DB가 준 실제 id로 바꿔 끼운다.
   (이걸 안 하면 방금 추가한 내역을 눌러도 목록에서 못 찾아 수정·삭제가 안 된다) */
function patchDomId(oldId, newId) {
  ['data-id', 'data-del'].forEach(function (attr) {
    var nodes = document.querySelectorAll('[' + attr + '="' + oldId + '"]');
    Array.prototype.forEach.call(nodes, function (n) { n.setAttribute(attr, newId); });
  });
}

function dbInsert(e) {
  var tmpId = e.id;
  beginOp();
  e._sync = sb.from('entries').insert(toRow(e)).select('id').single().then(function (res) {
    delete e._sync;
    if (res.error) {
      entries = entries.filter(function (x) { return x !== e; });
      endOp(false); renderAll();
      toast('저장하지 못했어요 😢 ' + errText(res.error), 'warn');
      return null;
    }
    e.id = res.data.id;
    patchDomId(tmpId, e.id);
    endOp(true);
    return e.id;
  });
  return e._sync;
}
/* 방금 추가해 아직 id를 못 받은 내역이면 insert가 끝날 때까지 기다린다 */
function settledId(e) {
  return e._sync ? e._sync : Promise.resolve(e.id);
}
function dbUpdate(e) {
  return settledId(e).then(function (id) {
    if (!id) return;
    beginOp();
    return sb.from('entries').update(toRow(e)).eq('id', id).then(function (res) {
      if (res.error) {
        endOp(false);
        toast('수정을 반영하지 못했어요 😢 ' + errText(res.error), 'warn');
        return refresh();
      }
      endOp(true);
    });
  });
}
function dbDelete(e) {
  return settledId(e).then(function (id) {
    if (!id) return;
    beginOp();
    return sb.from('entries').delete().eq('id', id).then(function (res) {
      if (res.error) {
        endOp(false);
        toast('삭제하지 못했어요 😢 ' + errText(res.error), 'warn');
        return refresh();
      }
      endOp(true);
    });
  });
}

/* ============ 분류 ============ */
var CATS = {
  expense: [['식비','🍚'],['카페/간식','🍰'],['교통','🚌'],['주거/공과금','🏠'],['쇼핑','🛍️'],
            ['의료','💊'],['교육','📚'],['문화/여가','🎬'],['통신','📱'],['기타','✨']],
  income:  [['급여','💰'],['용돈','🧧'],['부수입','💼'],['환급','🎁'],['기타','✨']]
};
var ICON = {};
CATS.expense.concat(CATS.income).forEach(function (p) { ICON[p[0]] = p[1]; });
function iconOf(n) { return ICON[n] || '📌'; }

/* ============ 유틸 ============ */
function $(id) { return document.getElementById(id); }
function pad(n) { return String(n).padStart(2, '0'); }
function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function won(n) { return n.toLocaleString('ko-KR') + '원'; }
function shortWon(n) {
  if (n >= 10000) { var m = n / 10000; return (m >= 100 ? Math.round(m) : Math.round(m * 10) / 10) + '만'; }
  return n.toLocaleString('ko-KR');
}
function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
var REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var DOW = ['일','월','화','수','목','금','토'];

/* ============ 상태 ============ */
var today = new Date();
var viewY = today.getFullYear();
var viewM = today.getMonth();
var selected = ymd(today);
var listFilter = 'all';
var formType = 'expense';
var formCat = '식비';
var editingId = null;
var bypassBigWarn = false;

/* ============ 숫자 카운트업 ============ */
function countTo(el, to) {
  var from = Number(el.dataset.v || 0);
  el.dataset.v = to;
  if (REDUCED || from === to) { el.textContent = won(to); return; }
  var t0 = performance.now(), dur = 550;
  function step(t) {
    var p = Math.min(1, (t - t0) / dur);
    var e = 1 - Math.pow(1 - p, 3);
    el.textContent = won(Math.round(from + (to - from) * e));
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ============ 렌더 ============ */
function monthEntries() {
  var key = viewY + '-' + pad(viewM + 1);
  return entries.filter(function (e) { return (e.date || '').slice(0, 7) === key; });
}
function isBig(e) { return e.type === 'expense' && e.amount >= BIG; }

function renderAll(dir) {
  renderHeader();
  renderSummary();
  renderBigAlert();
  renderCalendar(dir);
  renderDay();
  renderStats();
  renderMonthList();
}

function renderHeader() {
  $('mTitle').textContent = viewY + '년 ' + (viewM + 1) + '월';
  var me = monthEntries();
  var bal = me.reduce(function (s, e) { return s + (e.type === 'income' ? e.amount : -e.amount); }, 0);
  var mas = $('mascot'), bub = $('bubble');
  if (!me.length) { mas.textContent = '🐷'; bub.textContent = '이번 달 첫 기록을 남겨볼까요?'; }
  else if (bal > 0) { mas.textContent = '🐷'; bub.textContent = '잘하고 있어요! ' + won(bal) + ' 남았어요 ✨'; }
  else if (bal === 0) { mas.textContent = '🐽'; bub.textContent = '수입과 지출이 딱 맞았어요!'; }
  else { mas.textContent = '🐖'; bub.textContent = '이번 달은 ' + won(-bal) + ' 더 썼어요 🫧'; }
}

function renderSummary() {
  var me = monthEntries(), inc = 0, exp = 0;
  me.forEach(function (e) { if (e.type === 'income') inc += e.amount; else exp += e.amount; });
  countTo($('sInc'), inc);
  countTo($('sExp'), exp);
  countTo($('sBal'), inc - exp);
  var pct = inc > 0 ? Math.min(100, Math.round(exp / inc * 100)) : (exp > 0 ? 100 : 0);
  requestAnimationFrame(function () { $('ratioBar').style.width = pct + '%'; });
  $('calTag').textContent = me.length ? me.length + '건' : '기록 없음';
}

/* 이번 달 10만원 이상 지출 요약 배너 */
function renderBigAlert() {
  var bigs = monthEntries().filter(isBig);
  var slot = $('bigAlertSlot');
  if (!bigs.length) { slot.innerHTML = ''; return; }
  var total = bigs.reduce(function (s, e) { return s + e.amount; }, 0);
  slot.innerHTML = '<div class="bigalert"><span class="em">⚠️</span>' +
    '<span>이번 달 <b>10만원 이상</b> 큰 지출이 ' + bigs.length + '건 있어요 · 합계 ' + won(total) + '</span></div>';
}

function renderCalendar(dir) {
  var grid = $('grid');
  var startDow = new Date(viewY, viewM, 1).getDay();
  var days = new Date(viewY, viewM + 1, 0).getDate();
  var todayStr = ymd(new Date());

  var map = {};
  monthEntries().forEach(function (e) {
    var d = map[e.date] || (map[e.date] = { i: 0, e: 0, big: false });
    if (e.type === 'income') d.i += e.amount; else d.e += e.amount;
    if (isBig(e)) d.big = true;
  });

  var html = '';
  for (var i = 0; i < startDow; i++) html += '<div class="day pad"></div>';
  for (var d = 1; d <= days; d++) {
    var ds = viewY + '-' + pad(viewM + 1) + '-' + pad(d);
    var dow = new Date(viewY, viewM, d).getDay();
    var s = map[ds];
    var cls = ['day'];
    if (dow === 0) cls.push('sun');
    if (dow === 6) cls.push('sat');
    if (ds === todayStr) cls.push('today');
    if (ds === selected) cls.push('sel');
    html += '<button class="' + cls.join(' ') + '" data-date="' + ds + '" style="animation-delay:' + Math.min(d * 9, 320) + 'ms">' +
      (s && s.big ? '<span class="warn" title="10만원 이상 지출">⚠️</span>' : '') +
      '<span class="dn">' + d + '</span>' +
      (s && s.i ? '<span class="amt i">+' + shortWon(s.i) + '</span>' : '') +
      (s && s.e ? '<span class="amt e">-' + shortWon(s.e) + '</span>' : '') +
      '</button>';
  }
  grid.className = 'grid' + (dir === 'prev' ? ' in-left' : dir === 'next' ? ' in-right' : '');
  grid.innerHTML = html;
}

function renderDay() {
  var p = selected.split('-').map(Number);
  var dow = new Date(p[0], p[1] - 1, p[2]).getDay();
  $('dayTitle').textContent = p[1] + '월 ' + p[2] + '일 (' + DOW[dow] + ')';

  var list = entries.filter(function (e) { return e.date === selected; }).sort(function (a, b) { return b.id - a.id; });
  var inc = 0, exp = 0;
  list.forEach(function (e) { if (e.type === 'income') inc += e.amount; else exp += e.amount; });
  $('daySum').textContent = list.length
    ? (inc ? '수입 ' + won(inc) + (exp ? ' · ' : '') : '') + (exp ? '지출 ' + won(exp) : '')
    : '기록이 없는 날이에요';

  $('dayList').innerHTML = list.length
    ? list.map(itemHtml).join('')
    : '<div class="empty"><span class="big">🧺</span>이 날은 아직 비어 있어요<br>오른쪽 위 <b>+ 추가</b>로 기록해보세요!</div>';
}

function itemHtml(e, i) {
  return '<div class="item" data-id="' + e.id + '" style="animation-delay:' + Math.min((i || 0) * 45, 400) + 'ms">' +
    '<div class="ic ' + e.type + '">' + iconOf(e.category) + '</div>' +
    '<div class="tx"><div class="t1">' + esc(e.category) +
      (isBig(e) ? '<span class="big-badge">⚠️ 큰 지출</span>' : '') + '</div>' +
    '<div class="t2">' + (e.memo ? esc(e.memo) : e.date) + '</div></div>' +
    '<div class="money ' + e.type + '">' + (e.type === 'income' ? '+' : '-') + won(e.amount) + '</div>' +
    '<button class="del" data-del="' + e.id + '" title="삭제">✕</button></div>';
}

function renderStats() {
  var exp = monthEntries().filter(function (e) { return e.type === 'expense'; });
  var box = $('stats');
  if (!exp.length) {
    $('statTag').textContent = '0원';
    box.innerHTML = '<div class="empty"><span class="big">🥧</span>지출 기록이 쌓이면<br>분류별로 예쁘게 보여드릴게요!</div>';
    return;
  }
  var total = exp.reduce(function (s, e) { return s + e.amount; }, 0);
  $('statTag').textContent = won(total);
  var by = {};
  exp.forEach(function (e) { by[e.category] = (by[e.category] || 0) + e.amount; });
  var rows = Object.keys(by).map(function (k) { return [k, by[k]]; }).sort(function (a, b) { return b[1] - a[1]; }).slice(0, 6);

  box.innerHTML = rows.map(function (r, i) {
    var pc = Math.round(r[1] / total * 100);
    return '<div class="bar" style="animation-delay:' + (i * 60) + 'ms">' +
      '<div class="top"><span>' + iconOf(r[0]) + '</span><span class="nm">' + esc(r[0]) + '</span>' +
      '<span class="mn">' + won(r[1]) + '</span><span class="pc">' + pc + '%</span></div>' +
      '<div class="track"><i data-w="' + pc + '"></i></div></div>';
  }).join('');
  requestAnimationFrame(function () {
    Array.prototype.forEach.call(box.querySelectorAll('.track > i'), function (i) { i.style.width = i.dataset.w + '%'; });
  });
}

function renderMonthList() {
  var me = monthEntries()
    .filter(function (e) { return listFilter === 'all' || e.type === listFilter; })
    .sort(function (a, b) { return b.date.localeCompare(a.date) || b.id - a.id; });
  $('listTag').textContent = me.length + '건';
  $('monthList').innerHTML = me.length
    ? me.map(itemHtml).join('')
    : '<div class="empty"><span class="big">📭</span>표시할 내역이 없어요</div>';
}

/* ============ 세그먼트 pill ============ */
function moveSegPill(segEl, pillEl) {
  var on = segEl.querySelector('button.on');
  if (!on || !on.offsetWidth) return;
  pillEl.style.width = on.offsetWidth + 'px';
  pillEl.style.transform = 'translateX(' + (on.offsetLeft - 3) + 'px)';
}

/* ============ 시트 ============ */
function openSheet(entry) {
  editingId = entry ? entry.id : null;
  bypassBigWarn = false;
  formType = entry ? entry.type : 'expense';
  formCat = entry ? entry.category : CATS[formType][0][0];
  $('sheetTitleText').textContent = entry ? '✏️ 내역 수정' : '✏️ 내역 추가';
  $('fAmount').value = entry ? entry.amount.toLocaleString('ko-KR') : '';
  $('fDate').value = entry ? entry.date : selected;
  $('fMemo').value = entry ? (entry.memo || '') : '';
  $('delBtn').style.display = entry ? 'block' : 'none';
  syncTypeSeg();
  renderCats();
  updateWarnUI();
  $('backdrop').classList.add('open');
  $('sheet').classList.add('open');
  setTimeout(function () {
    moveSegPill($('typeSeg'), $('typePill'));
    if (window.innerWidth > 560) $('fAmount').focus();
  }, 60);
}
function closeSheet() {
  $('backdrop').classList.remove('open');
  $('sheet').classList.remove('open');
  $('alertBox').classList.remove('open');
  $('wipeBox').classList.remove('open');
  editingId = null;
}
function syncTypeSeg() {
  var seg = $('typeSeg');
  Array.prototype.forEach.call(seg.querySelectorAll('button'), function (b) {
    b.classList.toggle('on', b.dataset.type === formType);
  });
  moveSegPill(seg, $('typePill'));
}
function renderCats() {
  var has = CATS[formType].some(function (p) { return p[0] === formCat; });
  if (!has) formCat = CATS[formType][0][0];
  $('fCats').innerHTML = CATS[formType].map(function (p) {
    return '<button type="button" class="chip' + (p[0] === formCat ? ' on' : '') + '" data-cat="' + esc(p[0]) + '">' + p[1] + ' ' + esc(p[0]) + '</button>';
  }).join('');
}
function amountValue() { return parseInt(($('fAmount').value || '').replace(/[^0-9]/g, ''), 10) || 0; }
function setAmount(n) {
  $('fAmount').value = n ? n.toLocaleString('ko-KR') : '';
  var el = $('fAmount');
  el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
  updateWarnUI();
}

/* 입력 중 실시간 경고 */
function updateWarnUI() {
  var v = amountValue();
  var big = formType === 'expense' && v >= BIG;
  $('inlineWarn').innerHTML = big
    ? '<div class="bigalert" style="margin:10px 0 0"><span class="em">⚠️</span><span>한 번에 <b>10만원</b>이 넘는 지출이에요! 꼭 필요한 소비인지 한 번만 더 생각해봐요 🥲</span></div>'
    : '';
  $('fAmount').classList.toggle('danger-in', big);
  $('saveBtn').classList.toggle('warn', big);
  $('saveBtn').textContent = big ? '그래도 기록하기 ⚠️' : '저장하기 💾';
}

/* ============ 토스트 & 컨페티 ============ */
var toastTimer;
function toast(msg, kind) {
  var t = $('toast');
  t.textContent = msg;
  t.classList.toggle('warn', kind === 'warn');
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove('show'); }, kind === 'warn' ? 3200 : 1900);
}
function confetti(x, y, kind) {
  if (REDUCED) return;
  var pool = kind === 'income' ? ['💰','✨','🌱','💚','🎉'] : kind === 'warn' ? ['💸','😵','💦','⚠️','🫠'] : ['🍩','✨','🎉','💖','🫧'];
  for (var i = 0; i < 14; i++) {
    (function () {
      var s = document.createElement('span');
      s.className = 'confetti';
      s.textContent = pool[Math.floor(Math.random() * pool.length)];
      s.style.left = x + 'px';
      s.style.top = y + 'px';
      document.body.appendChild(s);
      var dx = (Math.random() - .5) * 260;
      var dy = -80 - Math.random() * 190;
      var rot = (Math.random() - .5) * 720;
      var a = s.animate([
        { transform: 'translate(-50%,-50%) scale(.4) rotate(0deg)', opacity: 1 },
        { transform: 'translate(' + (dx - 50) + '%,' + (dy * .5) + '%) scale(1.15) rotate(' + (rot * .5) + 'deg)', opacity: 1, offset: .45 },
        { transform: 'translate(' + (dx * 1.25 - 50) + '%,' + (Math.abs(dy) * 1.1) + '%) scale(.65) rotate(' + rot + 'deg)', opacity: 0 }
      ], { duration: 1000 + Math.random() * 500, easing: 'cubic-bezier(.2,.7,.4,1)' });
      a.onfinish = function () { s.remove(); };
    })();
  }
}

/* ============ 이벤트 ============ */
$('prevM').onclick = function () { viewM--; if (viewM < 0) { viewM = 11; viewY--; } renderAll('prev'); };
$('nextM').onclick = function () { viewM++; if (viewM > 11) { viewM = 0; viewY++; } renderAll('next'); };
$('todayBtn').onclick = function () {
  var n = new Date();
  viewY = n.getFullYear(); viewM = n.getMonth(); selected = ymd(n);
  renderAll();
  toast('오늘로 이동했어요 📍');
};

$('grid').addEventListener('click', function (ev) {
  var btn = ev.target.closest('.day');
  if (!btn || btn.classList.contains('pad')) return;
  selected = btn.dataset.date;
  Array.prototype.forEach.call($('grid').querySelectorAll('.day.sel'), function (d) { d.classList.remove('sel'); });
  btn.classList.add('sel');
  renderDay();
});
$('grid').addEventListener('dblclick', function (ev) {
  var btn = ev.target.closest('.day');
  if (!btn || btn.classList.contains('pad')) return;
  selected = btn.dataset.date;
  openSheet(null);
});

function bindList(el) {
  el.addEventListener('click', function (ev) {
    var delBtn = ev.target.closest('[data-del]');
    if (delBtn) {
      ev.stopPropagation();
      removeEntry(Number(delBtn.dataset.del), delBtn.closest('.item'));
      return;
    }
    var item = ev.target.closest('.item');
    if (!item) return;
    var id = Number(item.dataset.id);
    var e = null;
    entries.forEach(function (x) { if (x.id === id) e = x; });
    if (e) { selected = e.date; openSheet(e); }
  });
}
bindList($('dayList'));
bindList($('monthList'));

function removeEntry(id, node) {
  if (node && !REDUCED) {
    node.classList.add('removing');
    setTimeout(function () { finishRemove(id); }, 300);
  } else finishRemove(id);
}
function finishRemove(id) {
  var gone = null;
  entries = entries.filter(function (e) {
    if (e.id === id) { gone = e; return false; }
    return true;
  });
  if (!gone) return;
  dbDelete(gone);
  renderAll();
  toast('내역을 지웠어요 🗑️');
}

$('seg').addEventListener('click', function (ev) {
  var b = ev.target.closest('button[data-f]');
  if (!b) return;
  listFilter = b.dataset.f;
  Array.prototype.forEach.call($('seg').querySelectorAll('button'), function (x) { x.classList.toggle('on', x === b); });
  moveSegPill($('seg'), $('segPill'));
  renderMonthList();
});

$('fab').onclick = function () { openSheet(null); };
$('addDay').onclick = function () { openSheet(null); };
$('closeSheet').onclick = closeSheet;
$('backdrop').onclick = closeSheet;
document.addEventListener('keydown', function (ev) {
  if (ev.key === 'Escape') { closeSheet(); return; }
  if ($('sheet').classList.contains('open') || $('alertBox').classList.contains('open') ||
      $('wipeBox').classList.contains('open')) return;
  if (ev.key === 'ArrowLeft') $('prevM').click();
  if (ev.key === 'ArrowRight') $('nextM').click();
});

$('typeSeg').addEventListener('click', function (ev) {
  var b = ev.target.closest('button[data-type]');
  if (!b) return;
  formType = b.dataset.type;
  formCat = CATS[formType][0][0];
  bypassBigWarn = false;
  syncTypeSeg();
  renderCats();
  updateWarnUI();
});
$('fCats').addEventListener('click', function (ev) {
  var c = ev.target.closest('.chip');
  if (!c) return;
  formCat = c.dataset.cat;
  Array.prototype.forEach.call($('fCats').querySelectorAll('.chip'), function (x) { x.classList.toggle('on', x === c); });
});
$('fAmount').addEventListener('input', function () {
  var v = amountValue();
  $('fAmount').value = v ? v.toLocaleString('ko-KR') : '';
  bypassBigWarn = false;
  updateWarnUI();
});
$('fAmount').addEventListener('keydown', function (ev) { if (ev.key === 'Enter') $('saveBtn').click(); });
$('quick').addEventListener('click', function (ev) {
  var b = ev.target.closest('button');
  if (!b) return;
  bypassBigWarn = false;
  if (b.dataset.clear) setAmount(0);
  else setAmount(amountValue() + Number(b.dataset.add));
});

$('delBtn').onclick = function () {
  if (!editingId) return;
  var id = editingId;
  closeSheet();
  finishRemove(id);
};

/* ---- 저장 (10만원 이상 지출이면 확인 모달) ---- */
$('saveBtn').onclick = function () {
  var amount = amountValue();
  if (!amount) {
    var el = $('fAmount');
    el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
    el.focus();
    toast('금액을 입력해주세요 🙏');
    return;
  }
  if (formType === 'expense' && amount >= BIG && !bypassBigWarn) {
    $('alertAmt').textContent = won(amount);
    $('alertBox').classList.add('open');
    var sh = $('sheet');
    sh.classList.remove('shake'); void sh.offsetWidth; sh.classList.add('shake');
    var face = document.querySelector('.alertbox .face');
    face.style.animation = 'none'; void face.offsetWidth; face.style.animation = '';
    return;
  }
  commitSave(amount);
};
$('alertNo').onclick = function () {
  $('alertBox').classList.remove('open');
  $('fAmount').focus();
  toast('좋아요, 다시 한 번 생각해봐요 🌿');
};
$('alertYes').onclick = function () {
  $('alertBox').classList.remove('open');
  bypassBigWarn = true;
  commitSave(amountValue());
};

function commitSave(amount) {
  var date = $('fDate').value || ymd(new Date());
  var memo = $('fMemo').value.trim();
  var big = formType === 'expense' && amount >= BIG;
  var btn = $('saveBtn');
  var r = btn.getBoundingClientRect();

  if (editingId) {
    entries.forEach(function (e) {
      if (e.id === editingId) {
        e.type = formType; e.date = date; e.amount = amount; e.category = formCat; e.memo = memo;
        dbUpdate(e);
      }
    });
    toast(big ? '⚠️ 수정했어요 — 10만원이 넘는 큰 지출이에요!' : '수정했어요 ✏️', big ? 'warn' : '');
  } else {
    /* id는 DB가 내려준다. 그 전까지는 정렬상 맨 위로 오도록 임시 번호를 쓴다. */
    var fresh = { id: Date.now(), type: formType, date: date, amount: amount, category: formCat, memo: memo };
    entries.push(fresh);
    dbInsert(fresh);
    if (big) toast('⚠️ 큰 지출 기록! ' + won(amount) + ' — 이번 달 예산을 한 번 확인해봐요', 'warn');
    else toast((formType === 'income' ? '수입' : '지출') + ' ' + won(amount) + ' 기록 완료!');
    confetti(r.left + r.width / 2, r.top, big ? 'warn' : formType);
  }

  selected = date;
  var p = date.split('-').map(Number);
  viewY = p[0]; viewM = p[1] - 1;
  closeSheet();
  renderAll();
}

$('mascot').onclick = function () {
  var cheer = ['오늘도 화이팅! 🌷','조금씩 모으면 커져요 🪙','기록하는 당신, 멋져요 ✨','커피 한 잔 줄이면 어때요? ☕','큰 지출은 하루만 참아보기! 💪','잘하고 있어요! 💖'];
  $('bubble').textContent = cheer[Math.floor(Math.random() * cheer.length)];
  var r = this.getBoundingClientRect();
  confetti(r.left + r.width / 2, r.top + r.height / 2, 'income');
};

window.addEventListener('resize', function () {
  moveSegPill($('seg'), $('segPill'));
  if ($('sheet').classList.contains('open')) moveSegPill($('typeSeg'), $('typePill'));
});

/* 예전 localStorage 내역을 DB로 한 번만 옮긴다 */
function migrateLegacy() {
  var raw = null;
  try { raw = localStorage.getItem(LEGACY_KEY); } catch (e) { return; }
  if (!raw) return;

  var old = null;
  try { old = JSON.parse(raw); } catch (e) {}
  var rows = (Array.isArray(old) ? old : []).filter(function (e) {
    return e && (e.type === 'income' || e.type === 'expense') &&
      /^\d{4}-\d{2}-\d{2}$/.test(e.date || '') && Number(e.amount) > 0;
  }).map(function (e) {
    return {
      type: e.type, date: e.date, amount: Math.round(Number(e.amount)),
      category: String(e.category || '기타').slice(0, 40),
      memo: String(e.memo || '').slice(0, 200)
    };
  });

  if (!rows.length) { try { localStorage.removeItem(LEGACY_KEY); } catch (e) {} return; }
  if (entries.length) {
    /* DB에 이미 내역이 있으면 중복될 수 있으니 건드리지 않는다 */
    toast('이 브라우저에 예전 내역 ' + rows.length + '건이 남아 있어요. DB에 이미 내역이 있어 자동 업로드는 건너뛰었어요.', 'warn');
    return;
  }

  setSync('busy', '예전 내역 옮기는 중…');
  return sb.from('entries').insert(rows).select('id,type,date,amount,category,memo').then(function (res) {
    if (res.error) { toast('예전 내역을 옮기지 못했어요 — ' + errText(res.error), 'warn'); return; }
    entries = res.data.map(fromRow);
    try { localStorage.setItem(BACKUP_KEY, raw); localStorage.removeItem(LEGACY_KEY); } catch (e) {}
    toast('예전 내역 ' + rows.length + '건을 DB로 옮겼어요 📦');
  });
}

/* ---- 전체 초기화 ---- */
$('wipeBtn').onclick = function () {
  if (!entries.length) { toast('이미 비어 있어요 🧺'); return; }
  $('wipeCount').textContent = entries.length + '건';
  $('backdrop').classList.add('open');
  $('wipeBox').classList.add('open');
};
$('wipeNo').onclick = function () {
  closeSheet();
  toast('그대로 뒀어요 🌿');
};
$('wipeYes').onclick = function () {
  var n = entries.length;
  closeSheet();
  entries = [];
  renderAll();
  beginOp();
  sb.from('entries').delete().gt('id', 0).then(function (res) {
    endOp(!res.error);
    if (res.error) toast('초기화하지 못했어요 😢 ' + errText(res.error), 'warn');
    else toast(n + '건을 모두 지웠어요 🧹');
    /* 지우는 사이에 들어온 기록이 있을 수 있으니 DB 상태를 다시 읽어 맞춘다 */
    return refresh();
  });
};

var appReady = false;

/* 다른 기기에서 기록했을 수 있으니 탭으로 돌아오면 다시 읽어온다 */
document.addEventListener('visibilitychange', function () {
  if (!document.hidden && appReady && !busyOps) refresh();
});

/* ============ 시작 ============ */
renderAll();
moveSegPill($('seg'), $('segPill'));
setSync('busy', '불러오는 중…');

loadEntries()
  .then(migrateLegacy)
  .then(function () {
    appReady = true;
    renderAll();
    setSync('', '동기화됨');
  })
  .catch(function (err) {
    setSync('err', '불러오기 실패');
    toast('내역을 불러오지 못했어요 — ' + errText(err), 'warn');
  });
</script>
</body>
</html>
